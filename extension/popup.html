<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivyVision Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      padding: 14px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #06b6d4, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
    }
    .brand-title {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .sih-tag {
      font-size: 9px;
      font-family: monospace;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 6px;
      border-radius: 10px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .stat-row {
      display: grid;
      grid-cols: 2;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
      color: #38bdf8;
    }
    .stat-val.pii {
      color: #fb7185;
    }
    .stat-label {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .input-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    input {
      flex: 1;
      background: #020617;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
    input:focus {
      border-color: #0284c7;
    }
    .url-text {
      font-size: 10px;
      font-family: monospace;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 8px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #1e293b;
    }
    .status-pill {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">🛡️</div>
      <div>
        <div class="brand-title">PrivyVision</div>
      </div>
    </div>
    <span class="sih-tag">SIH26171 MV3</span>
  </div>

  <div class="url-text" id="active-url">Detecting active webpage...</div>

  <div class="card">
    <div class="card-title">
      <span>On-Device Perception</span>
      <span><span class="status-pill"></span>Active</span>
    </div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-val" id="grounded-count">--</div>
        <div class="stat-label">UI Elements Grounded</div>
      </div>
      <div class="stat-box">
        <div class="stat-val pii" id="pii-count">--</div>
        <div class="stat-label">PII Entities Masked</div>
      </div>
    </div>

    <div class="toggle-row">
      <span>Visual Bounding Box Overlays</span>
      <input type="checkbox" id="toggle-overlays" style="width: auto; cursor: pointer;">
    </div>
  </div>

  <div class="card">
    <div class="card-title">Command Execution</div>
    <div class="input-row">
      <input type="text" id="action-input" placeholder="e.g. #btn-submit, input[name='q']">
      <button class="btn" id="btn-click-action" style="width: auto; padding: 6px 12px;">Click</button>
    </div>
  </div>

  <button class="btn" id="btn-inspect-now">
    ⚡ Inspect Current Active Page
  </button>

  <button class="btn btn-secondary" id="btn-open-dashboard">
    🚀 Open Full Studio Dashboard
  </button>

  <script src="popup.js"></script>
</body>
</html>
